name: build

on:
  push:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          build-scan-publish: true
          build-scan-terms-of-use-url: https://gradle.com/terms-of-service
          build-scan-terms-of-use-agree: "yes"

      # `check` runs the unit tests and then jacocoTestCoverageVerification, which fails the
      # job when line coverage drops below 80%. The tests download the real platform-tools
      # archive from dl.google.com and run the real adb binary, so this job needs network access.
      - name: Run unit tests and enforce coverage gate
        run: ./gradlew check

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: jacoco-coverage-report
          path: build/reports/jacoco/test/
          if-no-files-found: warn

      - name: Build with Gradle
        run: ./gradlew shadowJar

      - name: Get current date
        if: github.ref == 'refs/heads/main'
        id: date
        run: echo "date=$(date --utc +%Y-%m-%dT%H-%M-%SZ)" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release and Upload Artifact
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ steps.date.outputs.date }}
          name: Release ${{ steps.date.outputs.date }}
          files: ./build/libs/android-chrome-tabs-exporter*.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
