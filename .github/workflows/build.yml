name: build

on:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      # `check` runs the unit tests and then jacocoTestCoverageVerification, which fails the
      # job when line coverage drops below 80%. The tests download the real platform-tools
      # archive from dl.google.com and run the real adb binary, so this job needs network access.
      - name: Run unit tests and enforce coverage gate
        run: ./gradlew check --scan

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: jacoco-coverage-report
          path: build/reports/jacoco/test/
          if-no-files-found: warn

      - name: Build with Gradle
        run: ./gradlew shadowJar --scan

      - name: Get current date
        if: github.ref == 'refs/heads/master'
        id: date
        run: echo "date=$(date --utc +%Y-%m-%dT%H-%M-%SZ)" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release and Upload Artifact
        if: github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.date.outputs.date }}
          name: Release ${{ steps.date.outputs.date }}
          files: ./build/libs/android-chrome-tabs-exporter*.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
