name: Bug report
description: Report something that doesn't work as documented.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Leave out the titles and URLs of your own tabs, private paths and other personal data, also from console output and screenshots.
  - type: textarea
    id: summary
    attributes:
      label: What happened
      description: What you saw, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: What you clicked, in which order, and how the phone was connected.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Release or commit, operating system, Java version, phone model, Android version and Chrome version.
  - type: textarea
    id: logs
    attributes:
      label: Console output
      description: The text from the area below the export button.
      render: text
